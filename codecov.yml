# Coverage is reported for visibility but does not gate merges. The real
# correctness gates for this codec are the cross-validation round-trips
# (encode then decode, and decode then re-encode, checked byte for byte), the
# RF64/RF64Auto sink cross-checks, and fuzzing; per-line coverage is a weak
# signal next to those. Small PRs that add a defensive error branch would
# otherwise fail codecov/patch against its default ~auto target, so both
# statuses are informational.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
